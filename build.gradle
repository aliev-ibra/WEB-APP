plugins {
    id 'java'
    id 'io.freefair.lombok' version '8.13.1'
}

group = 'com.vizja'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    // slf4j for logging
    implementation 'org.slf4j:slf4j-api:2.0.17'
    implementation 'org.slf4j:slf4j-simple:2.0.17'
    implementation 'tools.jackson.core:jackson-databind:3.0.0'
}

test {
    println("Not Supported")
}

// One project, one source set: every lab is a package under src/main/java.
// Both labs listen on port 8080, so run only one at a time.
tasks.register('runLab2', JavaExec) {
    group = 'application'
    description = 'Runs Lab 2.1 (Task Manager REST API) on http://localhost:8080'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.vizja.swp.lab2.Application'
}

tasks.register('runLab3', JavaExec) {
    group = 'application'
    description = 'Runs Lab 2.2 (Task Manager with cookies) on http://localhost:8080'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.vizja.lab3.App'
}
